<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUOTEX FAST</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0e1a;color:#fff;padding:15px}.h{background:linear-gradient(90deg,#00ff88,#00ccff);padding:15px;border-radius:15px;text-align:center;color:#000;font-weight:bold;font-size:20px}.c{background:#151b2e;border:2px solid #00ff88;border-radius:20px;padding:20px;text-align:center;margin-top:15px}.p{font-size:32px;font-weight:bold}.s{font-size:42px;font-weight:900;margin:12px 0}.CALL{color:#00ff88}.PUT{color:#ff4444}.e{font-size:26px;color:#ffcc00;font-weight:bold}.t{font-size:60px;font-weight:900}.b{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin-top:10px}.g{background:#00ff88;color:#000}.o{background:#222a44;color:#fff}</style></head><body><div class="h">⚡ QUOTEX FAST APP ⚡</div><div class="c"><div style="color:#00ff88">● LIVE FAST</div><div class="p" id="p">EUR/USD</div><div class="s" id="s">WAIT...</div><div class="e" id="e">--:--:--</div><div class="t" id="t">--</div><button class="b g" onclick="gen()">⚡ NEW SIGNAL</button><button class="b o" onclick="auto=!auto;this.innerText=auto?'AUTO ON':'AUTO OFF';if(auto)st()">AUTO ON</button></div><script>const P=["EUR/USD","GBP/USD","USD/JPY","AUD/JPY","EUR/JPY"];let auto=true,iv,ct;function gen(){let pr=P[Math.floor(Math.random()*P.length)],d=Math.random()>0.5?"CALL":"PUT",e=new Date(Date.now()+60000);document.getElementById("p").innerText=pr;let el=document.getElementById("s");el.innerText=d=="CALL"?"CALL UP 🟢":"PUT DOWN 🔴";el.className="s "+d;document.getElementById("e").innerText=e.toLocaleTimeString("en-IN",{hour12:false})+" IST";let s=60;clearInterval(ct);document.getElementById("t").innerText=s;ct=setInterval(()=>{s--;document.getElementById("t").innerText=s;if(s<=0)clearInterval(ct)},1000);if(navigator.vibrate)navigator.vibrate(200)}function st(){clearInterval(iv);iv=setInterval(gen,65000)}gen();st();</script></body></html>
