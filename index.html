<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUOTEX V16 - FIXED</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
.box{border:1px solid #333;border-radius:20px;padding:25px;margin-top:30px;background:#121212}
.live{color:#00ff88;font-size:26px;font-weight:bold}
.call{font-size:30px;margin:15px 0}
.entry{color:#ffcc00;font-size:26px;font-weight:bold;margin:10px 0}
.btn{width:100%;padding:18px;background:#00ff88;border:none;border-radius:15px;font-size:22px;font-weight:bold;margin-top:20px;color:#000}
</style>
</head>
<body>
<h2>⚡ QUOTEX V16 - FIXED</h2>
<div class="box">
<div id="pair" class="live">EUR/USD - LIVE</div>
<div id="signal" class="call">🔼 CALL UP 🟢</div>
<div id="current">CURRENT: --:--:--</div>
<div id="entry" class="entry">ENTRY: --:--</div>
<div>EXPIRY: 1 MIN</div>
</div>
<button class="btn" onclick="generate()">NEW SIGNAL</button>
<script>
function getNext(){
 let n=new Date();
 let nx=new Date(n);
 nx.setMinutes(n.getMinutes()+1);
 nx.setSeconds(0);
 nx.setMilliseconds(0);
 if((nx-n)/1000<5){nx.setMinutes(nx.getMinutes()+1);}
 return nx;
}
function f1(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+" IST";}
function f2(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+":"+String(d.getSeconds()).padStart(2,'0')+" IST";}
function generate(){
 let pairs=["EUR/USD","GBP/USD","USD/JPY"];
 let sig=["🔼 CALL UP 🟢","🔽 PUT DOWN 🔴"];
 let p=pairs[Math.floor(Math.random()*pairs.length)];
 let s=sig[Math.floor(Math.random()*sigs.length)];
 let now=new Date();
 let ent=getNext();
 document.getElementById('pair').innerText=p+" - LIVE";
 document.getElementById('signal').innerText=s;
 document.getElementById('current').innerText="CURRENT: "+f2(now);
 document.getElementById('entry').innerText="ENTRY: "+f1(ent);
}
window.onload=function(){generate(); setInterval(function(){document.getElementById('current').innerText="CURRENT: "+f2(new Date());},1000);};
</script>
</body>
</html>
