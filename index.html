<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QUOTEX V16</title><style>body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}.box{border:1px solid #333;border-radius:20px;padding:25px;background:#121212}.live{color:#00ff88;font-size:26px;font-weight:bold}.call{font-size:30px;margin:15px 0}.entry{color:#ffcc00;font-size:26px;font-weight:bold}.btn{width:100%;padding:18px;background:#00ff88;border:none;border-radius:15px;font-size:22px;font-weight:bold;margin-top:20px;color:#000}</style></head><body><h2>⚡ QUOTEX V16 - FIXED</h2><div class="box"><div id="pair" class="live">EUR/USD - LIVE</div><div id="signal" class="call">CALL UP</div><div id="current">CURRENT: --:--</div><div id="entry" class="entry">ENTRY: --:--</div><div>EXPIRY: 1 MIN</div></div><button class="btn" onclick="gen()">NEW SIGNAL</button><script>function getNext(){let n=new Date(),x=new Date(n);x.setMinutes(n.getMinutes()+1);x.setSeconds(0);return x}function fM(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+" IST"}function fS(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+":"+String(d.getSeconds()).padStart(2,'0')+" IST"}function gen(){let p=["EUR/USD","GBP/USD"][Math.floor(Math.random()*2)];let s=["CALL UP","PUT DOWN"][Math.floor(Math.random()*2)];let n=new Date(),e=getNext();document.getElementById('pair').innerText=p+" - LIVE";document.getElementById('signal').innerText=s;document.getElementById('current').innerText="CURRENT: "+fS(n);document.getElementById('entry').innerText="ENTRY: "+fM(e)}gen();setInterval(()=>{document.getElementById('current').innerText="CURRENT: "+fS(new Date())},1000);</script></body></html>
