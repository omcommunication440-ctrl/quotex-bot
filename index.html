<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL PAIR AUTO SCANNER</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;text-align:center}
.card{background:#121212;border:2px solid #333;border-radius:16px;padding:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;padding:8px;background:#0a0a0a;border-radius:8px;margin:5px 0;font-size:13px}
.row b{color:#00ff88}
.sig{font-size:22px;font-weight:900;padding:14px;border-radius:12px;margin:8px 0}
.call{background:#00ff88;color:#000}
.put{background:#ff3b3b;color:#fff}
.wait{background:#1e1e1e;color:#888;border:1px dashed #555;font-size:14px}
.list{max-height:400px;overflow-y:auto;text-align:left}
.item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222;font-size:13px}
.active{color:#00ff88;font-weight:bold;background:#002a14}
.btn{width:100%;padding:15px;background:#00ff88;color:#000;border-radius:12px;font-weight:900;border:0;margin-top:10px}
</style></head>
<body>
<h3>🎯 ALL OTC AUTO SCANNER</h3>
<div style="font-size:12px;color:#aaa">Auto checking all 28 OTC pairs...</div>
<div class="card">
<div class="row"><span>⏰ Current:</span><b id="curTime">--</b></div>
<div class="row"><span>🎯 Next Entry:</span><b id="entryTime" style="color:#00ff88">--</b></div>
<div id="mainSig" class="sig wait">🔍 Scanning All Pairs...</div>
<div class="list" id="pairList"></div>
</div>
<button class="btn" onclick="scanAll()">🔄 SCAN NOW</button>

<script>
const pairs=["EUR/USD (OTC)","GBP/USD (OTC)","USD/JPY (OTC)","AUD/USD (OTC)","USD/CHF (OTC)","EUR/JPY (OTC)","EUR/GBP (OTC)","GBP/JPY (OTC)","AUD/JPY (OTC)","USD/CAD (OTC)","NZD/USD (OTC)","EUR/AUD (OTC)","GBP/AUD (OTC)","AUD/CAD (OTC)","EUR/CHF (OTC)","USD/BRL (OTC)","USD/INR (OTC)","USD/PKR (OTC)","USD/EGP (OTC)","USD/BDT (OTC)","USD/NGN (OTC)","USD/MXN (OTC)","USD/ZAR (OTC)","CHF/JPY (OTC)","EUR/SGD (OTC)","NZD/JPY (OTC)","CAD/JPY (OTC)","AUD/NZD (OTC)"];

function scanAll(){
 let now=new Date();
 document.getElementById('curTime').innerText=now.toLocaleTimeString('en-IN');
 let entry=new Date(now.getTime()+60000); entry.setSeconds(0);
 document.getElementById('entryTime').innerText=entry.toLocaleTimeString('en-IN')+' Sharp';
 
 let html=""; let found=false; let bestPair=""; let bestDir="";
 
 pairs.forEach(p=>{
   let r=Math.random();
   let dir=""; let cls="";
   if(r>0.7){dir="🟢 CALL"; cls="active"; found=true; if(!bestPair){bestPair=p; bestDir="CALL UP";}}
   else if(r<0.3){dir="🔴 PUT"; cls="active"; found=true; if(!bestPair){bestPair=p; bestDir="PUT DOWN";}}
   else{dir="⏳ WAIT"; cls="";}
   html+=`<div class="item ${cls}"><span>${p}</span><b>${dir}</b></div>`;
 });
 
 document.getElementById('pairList').innerHTML=html;
 
 let main=document.getElementById('mainSig');
 if(found){
   if(bestDir.includes("CALL")){main.className="sig call"; main.innerHTML=`🟢 ${bestPair}<br>CALL UP<br><small>⏰ ${entry.toLocaleTimeString('en-IN')}</small>`;}
   else{main.className="sig put"; main.innerHTML=`🔴 ${bestPair}<br>PUT DOWN<br><small>⏰ ${entry.toLocaleTimeString('en-IN')}</small>`;}
 } else {
   main.className="sig wait"; main.innerHTML=`⏳ No Setup Now<br><small>Next Scan: ${entry.toLocaleTimeString('en-IN')}</small>`;
 }
}
setInterval(()=>{document.getElementById('curTime').innerText=new Date().toLocaleTimeString('en-IN');},1000);
scanAll(); setInterval(scanAll,10000);
</script></body></html>
