<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QUOTEX V17 FILTER</title><style>body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}.box{border:2px solid #333;border-radius:20px;padding:25px;background:#121212}.live{color:#00ff88;font-size:22px;font-weight:bold}.call{font-size:32px;margin:15px 0;font-weight:bold}.entry{color:#ffcc00;font-size:22px}.wait{color:#ff4444;font-size:28px;font-weight:bold}.btn{width:100%;padding:18px;background:#00ff88;border:none;border-radius:15px;font-size:20px;font-weight:bold;margin-top:20px;color:#000}</style></head><body><h2>⚡ QUOTEX V17 - 90% FILTER</h2><div class="box"><div id="pair" class="live">CHECKING MARKET...</div><div id="signal" class="call">--</div><div id="current">CURRENT: --:--</div><div id="entry" class="entry">ENTRY: --:--</div><div id="conf" style="color:#aaa;margin-top:10px">CONFIDENCE: --</div></div><button class="btn" onclick="gen()">ANALYZE MARKET</button><script>function getNext(){let n=new Date(),x=new Date(n);x.setMinutes(n.getMinutes()+1);x.setSeconds(0);return x}function fM(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+" IST"}function fS(d){return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0')+":"+String(d.getSeconds()).padStart(2,'0')+" IST"}function gen(){let n=new Date(),e=getNext();let rand=Math.random();document.getElementById('current').innerText="CURRENT: "+fS(n);document.getElementById('entry').innerText="ENTRY: "+fM(e);if(rand<0.60){document.getElementById('pair').innerText="⚠️ MARKET SIDEWAYS";document.getElementById('signal').innerText="WAIT";document.getElementById('signal').className="wait";document.getElementById('conf').innerText="CONFIDENCE: 40% - NO TRADE";return}let p=["EUR/USD OTC","GBP/USD OTC"][Math.floor(Math.random()*2)];let s=rand>0.8?"CALL UP 🟢":"PUT DOWN 🔴";let conf=Math.floor(75+Math.random()*15);document.getElementById('pair').innerText=p+" - TREND FOUND";document.getElementById('signal').innerText=s;document.getElementById('signal').className="call";document.getElementById('signal').style.color=s.includes("CALL")?"#00ff88":"#ff4444";document.getElementById('conf').innerText="CONFIDENCE: "+conf+"% - TAKE TRADE"}gen();setInterval(()=>{document.getElementById('current').innerText="CURRENT: "+fS(new Date())},1000);</script></body></html>
