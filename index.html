<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUOTEX V16 LIVE</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:15px;padding:20px;max-width:400px;margin:20px auto}
.btn{background:#00ff88;color:#000;padding:15px 30px;border:none;border-radius:10px;font-weight:bold;font-size:18px;width:100%;cursor:pointer}
.pair{font-size:28px;font-weight:bold;color:#00ff88}
.dir{font-size:32px;margin:15px 0}
.time{color:#aaa;font-size:14px}
.entry{color:#ffcc00;font-size:20px;font-weight:bold;margin:10px 0}
</style>
</head>
<body>
<h2>⚡️ QUOTEX V16 - LIVE</h2>
<div class="card" id="card">
<div class="pair" id="pair">EUR/USD - LIVE</div>
<div class="dir" id="dir">WAIT</div>
<div class="time" id="ctime">CURRENT: --:--:-- IST</div>
<div class="entry" id="etime">ENTRY: --:--:-- IST</div>
<div style="margin-top:10px">EXPIRY: 1 MIN</div>
</div>
<button class="btn" onclick="gen()">NEW SIGNAL</button>
<br><br>
<button class="btn" style="background:#222;color:#fff" onclick="toggleAuto()" id="autoBtn">AUTO OFF</button>

<script>
const PAIRS = ["EUR/USD","GBP/USD","USD/JPY","AUD/JPY","EUR/JPY","GBP/JPY"];
let auto = false, interval;

function getIST(){
  return new Date().toLocaleString("en-GB", {timeZone:"Asia/Kolkata", hour12:false}).split(', ')[1];
}
function getEntryIST(){
  let d = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
  d.setMinutes(d.getMinutes()+1);
  return d.toLocaleTimeString("en-GB", {hour12:false});
}

function gen(){
  let pair = PAIRS[Math.floor(Math.random()*PAIRS.length)];
  let dir = Math.random()>0.5 ? "🔼 CALL UP 🟢" : "🔽 PUT DOWN 🔴";
  document.getElementById('pair').innerText = pair + " - LIVE";
  document.getElementById('dir').innerText = dir;
  document.getElementById('ctime').innerText = "CURRENT: " + getIST() + " IST";
  document.getElementById('etime').innerText = "ENTRY: " + getEntryIST() + " IST";
  if(navigator.vibrate) navigator.vibrate(100);
}
function toggleAuto(){
  auto = !auto;
  document.getElementById('autoBtn').innerText = auto ? "AUTO ON ✅" : "AUTO OFF";
  if(auto){ interval = setInterval(gen, 60000); gen(); }
  else clearInterval(interval);
}
gen();
setInterval(()=>{ document.getElementById('ctime').innerText = "CURRENT: " + getIST() + " IST"; }, 1000);
</script>
</body>
</html>
