<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTC PAIR + TIME BOT</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}
.card{background:#121212;border:2px solid #333;border-radius:20px;padding:16px}
.row{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin:6px 0;background:#0a0a0a;padding:8px 10px;border-radius:8px}
.row b{color:#fff;font-size:13px}
select{width:100%;padding:14px;background:#1e1e1e;color:#fff;border:2px solid #00ff88;border-radius:12px;margin-bottom:12px;font-weight:bold}
.candle{font-size:24px;letter-spacing:5px;margin:10px 0;padding:10px;background:#0a0a0a;border-radius:10px}
.sig{font-size:26px;font-weight:900;margin:14px 0;padding:18px;border-radius:16px;line-height:1.3}
.call{background:#00ff88;color:#000;box-shadow:0 0 20px #00ff88aa}
.put{background:#ff3b3b;color:#fff;box-shadow:0 0 20px #ff3b3baa}
.wait{background:#1e1e1e;color:#ffcc00;border:1px dashed #555}
.btn{width:100%;padding:16px;background:#fff;color:#000;border-radius:12px;font-weight:900;border:0;font-size:17px}
.time{color:#00ff88;font-size:16px;font-weight:bold}
</style></head>
<body>
<h3>🎯 OTC BOT - PAIR + TIME</h3>

<select id="pair">
<option>EUR/USD (OTC)</option><option>GBP/USD (OTC)</option><option>USD/JPY (OTC)</option><option>AUD/USD (OTC)</option><option>USD/CHF (OTC)</option><option>EUR/JPY (OTC)</option><option>EUR/GBP (OTC)</option><option>GBP/JPY (OTC)</option><option>AUD/JPY (OTC)</option><option>USD/CAD (OTC)</option><option>NZD/USD (OTC)</option><option>EUR/AUD (OTC)</option><option>GBP/AUD (OTC)</option><option>AUD/CAD (OTC)</option><option>EUR/CHF (OTC)</option><option>USD/BRL (OTC)</option><option>USD/INR (OTC)</option><option>USD/PKR (OTC)</option><option>USD/EGP (OTC)</option><option>USD/BDT (OTC)</option><option>USD/NGN (OTC)</option><option>USD/MXN (OTC)</option><option>USD/ZAR (OTC)</option><option>CHF/JPY (OTC)</option><option>EUR/SGD (OTC)</option><option>NZD/JPY (OTC)</option><option>CAD/JPY (OTC)</option>
</select>

<div class="card">
<div class="row"><span>📊 Pair Name:</span><b id="pairName">EUR/USD (OTC)</b></div>
<div class="row"><span>💰 Live Price:</span><b id="price">--</b></div>
<div class="row"><span>⏰ Current Time:</span><b id="curTime">--</b></div>
<div class="row"><span>🎯 Entry Time:</span><b id="entryTime" class="time">--</b></div>
<div class="candle" id="cand">----</div>
<div id="sig" class="sig wait">Scanning...</
